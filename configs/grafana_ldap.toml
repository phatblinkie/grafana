[[servers]]
host = "192.168.10.200"
port = 389
use_ssl = false
start_tls = true
ssl_skip_verify = true
bind_dn = "forward.sa@j114.army.mil"
bind_password = '$__env{LDAP_BIND_PASSWORD}'
search_filter = "(|(sAMAccountName=%s)(userPrincipalName=%s))"
search_base_dns = ["OU=Users,OU=ogs,DC=j114,DC=army,DC=mil"]

[servers.attributes]
member_of = "memberOf"
email =  "userPrincipalName"
Username = "sAMAccountName"

