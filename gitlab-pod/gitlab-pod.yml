apiVersion: v1
kind: Pod
metadata:
  name: gitlab
  annotations:
    io.podman.annotations.userns: keep-id
spec:
  restartPolicy: Never
  networks:
    - name: podman-default-kube-network
  volumes:
    - name: gitlab-config
      hostPath:
        path: /mission-share/podman/containers/gitlab/config
        type: DirectoryOrCreate
    - name: gitlab-data
      hostPath:
        path: /mission-share/podman/containers/gitlab/data
        type: DirectoryOrCreate
    - name: gitlab-logs
      hostPath:
        path: /mission-share/podman/containers/gitlab/logs
        type: DirectoryOrCreate
    - name: resolv-conf
      hostPath:
        path: /mission-share/podman/containers/configs/resolv.conf
        type: File
  containers:
    - name: gitlab
      image: localhost/gitlab-ce-custom:17.11.6-ce.0
      hostname: 192.168.10.211
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      resources:
        limits:
          memory: "12560Mi"
      env:
        - name: GITLAB_ROOT_EMAIL
          value: "administrator@localhost.com"
        - name: GITLAB_ROOT_PASSWORD
          value: "0o9i8u7y)O(I*U&Y"
        # Optional: Try GITLAB_OMNIBUS_CONFIG
        - name: GITLAB_OMNIBUS_CONFIG
          value: |
            external_url 'http://192.168.10.211:8088'
            nginx['listen_port'] = 80
            nginx['listen_address'] = ['0.0.0.0']
            gitlab_rails['initial_root_password'] = '0o9i8u7y)O(I*U&Y'
            gitlab_rails['initial_root_email'] = 'administrator@localhost.com'
      volumeMounts:
        - name: gitlab-config
          mountPath: /etc/gitlab:Z
        - name: gitlab-data
          mountPath: /var/opt/gitlab:Z
        - name: gitlab-logs
          mountPath: /var/log/gitlab:Z
        - name: resolv-conf
          mountPath: /etc/resolv.conf
      ports:
        - containerPort: 443
          hostPort: 9443
        - containerPort: 80
          hostPort: 8088
        - containerPort: 22
          hostPort: 2200
