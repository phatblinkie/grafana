apiVersion: 1

providers:
# For OGS dashboards
- name: 'ogs-dashboards'
  orgId: 1
  folder: 'OGS'
  type: file
  disableDeletion: true
  updateIntervalSeconds: 30
  options:
    path: /var/lib/grafana/dashboards/OGS

# For sample dashboards
- name: 'sample-dashboards'
  orgId: 1
  folder: 'Samples'
  type: file
  disableDeletion: false
  updateIntervalSeconds: 30
  options:
    path: /var/lib/grafana/dashboards/Samples

# For glam dashboards
- name: 'TSB-dashboards'
  orgId: 1
  folder: 'TSB'
  type: file
  disableDeletion: false
  updateIntervalSeconds: 30
  options:
    path: /var/lib/grafana/dashboards/TSB


